<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body data-spy="scroll" data-target=".bs-docs-sidebar">
<header>

</header>
<!-- Subhead
================================================== -->

<section id="maincontent">
    <style>
        table {
            width: 100%;
            border-collapse: collapse; /* Ensures that borders between cells are collapsed into a single border */
        }
        th, td {
            padding: 10px; /* Adds padding inside each cell */
            border: 1px solid #ddd; /* Adds a light border around each cell */
        }
        thead th {
            background-color: #4CAF50; /* Green background for table header */
            color: white; /* White text color for header */
            text-align: left; /* Aligns header text to the left */
        }
        tbody tr:nth-child(odd) {
            background-color: #f2f2f2; /* Light gray background for odd rows */
        }
        tbody tr:hover {
            background-color: #ddd; /* Highlight background on hover for rows */
        }
    </style>
    <div class="container">
        <h3>Employees </h3>
        <table>
            <thead>
            <tr>
                <th>First Name</th>
                <th>Second Name</th>
                <th>Salary</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employeesavedto.getData()}">
                <td th:text="${employee.first_name}"></td>
                <td th:text="${employee.second_name}"></td>
                <td th:text="${employee.salary}"></td>


            </tr>
            </tbody>
        </table>

        <hr>

        <a th:href="@{/employee/home}"> Back to Employee List</a>

    </div>

</section>

</body>

</html>
